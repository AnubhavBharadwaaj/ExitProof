# Central rules that set WHEN money is paid on exit.
# Owner: named legal owner must sign every new version (see legal_owner).
# Sources:
#   Code on Wages s.17(2), two working days: https://www.livelaw.in/articles/two-working-days-code-wages-employee-final-settlement-552780
#   Gratuity 30 days, fixed term gratuity after 1 year: https://www.pockethrms.com/blog/full-and-final-settlement/
id: central.labour_codes
version: 2026.11.1
effective_from: 2025-11-21
legal_owner: "Legal owner (to be named by TBO HR)"
clocks:
  wages:
    # Clock A. Leave encashment is treated as wages (confirmed by a labour law advocate, Nov 2026).
    components: [salary_for_days_worked, leave_encashment, notice_pay_due_to_employee, reimbursements_due]
    anchor: last_working_day
    working_days: 2
    statute: "Code on Wages, 2019, s.17(2)"
  gratuity:
    # Clock B.
    components: [gratuity]
    anchor: last_working_day
    calendar_days: 30
    statute: "Code on Social Security, 2020 (gratuity)"
gratuity_eligibility:
  permanent_min_years: 5
  fixed_term_min_years: 1
  days_per_year: 15
  divisor: 26
tests:
  - name: wages due two working days after a Monday exit
    given: {last_working_day: 2026-12-28, state: maharashtra}
    expect: {wages_due: 2026-12-30}
  - name: gratuity due thirty days after exit
    given: {last_working_day: 2026-12-28, state: maharashtra}
    expect: {gratuity_due: 2027-01-27}
